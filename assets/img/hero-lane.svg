<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Pista de bowling con pinos al fondo">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071a33"/>
      <stop offset=".55" stop-color="#0b2545"/>
      <stop offset="1" stop-color="#04101f"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9924e" stop-opacity=".28"/>
      <stop offset="1" stop-color="#c9924e" stop-opacity=".9"/>
    </linearGradient>
    <radialGradient id="spot" cx=".75" cy=".42" r=".42">
      <stop offset="0" stop-color="#8fc4ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8fc4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ball" x1=".25" y1=".15" x2=".8" y2="1">
      <stop offset="0" stop-color="#2a3442"/>
      <stop offset="1" stop-color="#0c1017"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#spot)"/>

  <!-- pista en perspectiva -->
  <path d="M1110 470 L1290 470 L1600 900 L560 900 Z" fill="url(#lane)"/>
  <g stroke="#f6e6cd" stroke-opacity=".3" stroke-width="2" fill="none">
    <path d="M1150 470 L1030 900M1190 470 L1240 900M1230 470 L1450 900"/>
  </g>
  <path d="M1110 470 L1290 470 L1600 900 L560 900 Z" fill="none" stroke="#f6e6cd" stroke-opacity=".35" stroke-width="3"/>

  <!-- canales laterales -->
